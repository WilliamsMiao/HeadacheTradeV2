[project]
name = "headache-trade-v2"
version = "0.1.0"
description = "Structural trend trading MVP for US stocks with Futu OpenD, FastAPI, and SQLite."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "futu-api>=9.0",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
headache-trade = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
