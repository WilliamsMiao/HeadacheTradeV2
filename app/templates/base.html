<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "HeadacheTradeV2" }}</title>
  <link rel="stylesheet" href="/static/styles.css?v={{ static_version }}">
</head>
<body>
  <header class="mobile-header">
    <a class="brand" href="/">
      <span class="brand-mark">HT</span>
      <span>HeadacheTradeV2</span>
    </a>
    <button class="secondary mobile-menu-button" type="button" data-nav-toggle aria-label="打开导航" aria-expanded="false">菜单</button>
  </header>
  <aside class="shell-nav" id="primary-navigation">
    <a class="brand" href="/">
      <span class="brand-mark">HT</span>
      <span>HeadacheTradeV2</span>
    </a>
    <nav aria-label="主导航">
      <span class="nav-group-label">交易作战</span>
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>作战台</a>
      <a href="/positions" {% if request.url.path == "/positions" %}aria-current="page"{% endif %}>模拟持仓</a>
      <a href="/trade-plans" {% if request.url.path == "/trade-plans" %}aria-current="page"{% endif %}>交易计划</a>
      <a href="/sim-orders" {% if request.url.path == "/sim-orders" %}aria-current="page"{% endif %}>模拟订单</a>
      <a href="/journal" {% if request.url.path == "/journal" %}aria-current="page"{% endif %}>交易复盘</a>

      <span class="nav-group-label">机会来源</span>
      <a href="/candidates" {% if request.url.path == "/candidates" %}aria-current="page"{% endif %}>候选观察池</a>
      <a href="/structures" {% if request.url.path == "/structures" %}aria-current="page"{% endif %}>结构事件</a>
      <a href="/battle-pool" {% if request.url.path == "/battle-pool" %}aria-current="page"{% endif %}>结构作战池</a>
      <a href="/market" {% if request.url.path == "/market" %}aria-current="page"{% endif %}>市场风向标</a>

      <span class="nav-group-label">系统控制</span>
      <a href="/risk" {% if request.url.path == "/risk" %}aria-current="page"{% endif %}>风控与仓位</a>
      <a href="/opend" {% if request.url.path == "/opend" %}aria-current="page"{% endif %}>OpenD 管理</a>
      <a href="/audit-logs" {% if request.url.path == "/audit-logs" %}aria-current="page"{% endif %}>系统审计</a>
    </nav>
    <div class="nav-footer">
      <button data-logout>退出登录</button>
    </div>
  </aside>
  <button class="nav-scrim" type="button" data-nav-close aria-label="关闭导航"></button>
  <main class="shell-main">
    <div class="content-shell">
      {% block content %}{% endblock %}
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/app.js?v={{ static_version }}"></script>
</body>
</html>
