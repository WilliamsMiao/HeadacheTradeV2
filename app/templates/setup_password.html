<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置访问密码</title>
  <link rel="stylesheet" href="/static/styles.css?v={{ static_version }}">
</head>
<body class="auth-body">
  <main class="auth-card">
    <span class="brand-mark">HT</span>
    <h1>设置访问密码</h1>
    <p>这是本系统独立密码，不是服务器密码，也不是 Futu 密码。密码只保存哈希。</p>
    <form id="setup-password-form">
      <label>新访问密码<input name="password" type="password" autocomplete="new-password" minlength="8" required autofocus><small>至少 8 个字符。</small></label>
      <label>再次确认<input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></label>
      <div class="form-actions">
        <button type="submit" data-loading-text="正在保存">保存并进入系统</button>
        <span class="inline-feedback" data-form-feedback aria-live="polite"></span>
      </div>
    </form>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js?v={{ static_version }}"></script>
</body>
</html>
